name: Build desktop packages

on:
  workflow_dispatch:
  push:
    branches: ['desktop-build-validation-*']
  pull_request:
    paths:
      - '.github/workflows/desktop-build.yml'
      - 'app/**'
      - 'script/**'
      - 'packaging/**'
      - 'requirements*.txt'
      - 'tests/**'

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2022
            python: '3.12'
            archive: Crayotter-Windows-x64.zip
            artifact: Crayotter-Windows-x64
          - name: macOS arm64
            os: macos-15
            python: '3.11'
            archive: dist/Crayotter-macOS-arm64.zip
            artifact: Crayotter-macOS-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -r requirements-desktop.txt -r requirements-mcp.txt
      - name: Build frontend
        working-directory: app/frontend_src
        shell: bash
        run: |
          npm ci
          node --test src/*.test.js
          npm run build
      - name: Prepare Mac media tools
        if: runner.os == 'macOS'
        run: python script/setup_ffmpeg.py
      - name: Prepare Windows media tools
        if: runner.os == 'Windows'
        run: python packaging/prepare_windows_assets.py
      - name: Python regression tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            export PATH="$PWD/packaging/generated/windows:$PWD/script/dep/windows:$PATH"
            export FFMPEG_BIN="$(python -c 'from pathlib import Path; print(Path("packaging/generated/windows/ffmpeg.exe").resolve())')"
            export FFPROBE_BIN="$(python -c 'from pathlib import Path; print(Path("packaging/generated/windows/ffprobe.exe").resolve())')"
          else
            export PATH="$PWD/script/dep/macos/arm64:$PATH"
          fi
          python -m unittest discover -s tests -v
      - name: Build Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/build_windows.ps1 -SkipInstall
      - name: Build Mac package
        if: runner.os == 'macOS'
        shell: bash
        run: CRAYOTTER_BUILD_PYTHON="$(command -v python)" packaging/build_macos.sh --skip-install
      - name: Verify extracted package
        run: python packaging/verify_desktop_package.py --archive "${{ matrix.archive }}" --report package-smoke.json
      - name: Upload verified package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.archive }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.artifact }}-validation
          path: package-smoke.json
          if-no-files-found: ignore
          retention-days: 7
